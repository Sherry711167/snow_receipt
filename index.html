    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        body { background:#f5f5f5; padding:12px; }
        .container { max-width:1150px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:16px; }
        @media(min-width:768px){ .container{ grid-template-columns: 440px 1fr; gap:24px; } }
        .form-panel { background:#fff; padding:16px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .ticket-panel { background:#fff; padding:16px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .form-item { margin-bottom:12px; }
        label { display:block; margin-bottom:4px; font-size:14px; color:#333; }
        input,textarea,select { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:6px; font-size:15px; }
        textarea { min-height:70px; resize:vertical; }
        .color-input { width:60px; height:36px; padding:0; border:none; cursor:pointer; border-radius:6px; }
        .row-block { margin:16px 0; padding-bottom:14px; border-bottom:1px dashed #ddd; }
        .list-row { display:flex; gap:8px; margin-bottom:8px; }
        .list-row input { flex:1; }
        button { padding:10px 16px; border:none; border-radius:6px; cursor:pointer; color:#fff; font-size:14px; }
        .btn-add { background:#409eff; }
        .btn-calc { background:#67c23a; }
        .btn-save { background:#e6a23c; }
        .btn-copy { background:#9b59b6; }
        .btn-reset { background:#e74c3c; }
        .switch-row { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0; }
        .switch-row label { display:inline-flex; align-items:center; gap:4px; font-size:13px; }
        .tip-box { background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:10px 12px; font-size:12px; color:#8d6e00; margin-bottom:12px; line-height:1.6; }
        @media (max-width:600px){
            body { padding:8px; }
            .container { gap:12px; }
            .form-panel, .ticket-panel { padding:12px; }
            .list-row{ flex-wrap:wrap; gap:6px; }
            .list-row input{ flex:1 1 40%; padding:8px; }
            .list-row button{ flex:1 1 100%; padding:8px; }
            button { width:100%; margin-bottom:6px; }
        }

        .ticket {
            margin:0 auto;
            background:#fff;
            border-radius:10px;
            overflow:hidden;
            padding:0;
        }
        .decor-bar {
            height:25px;
            position:relative;
            display:block;
            overflow:hidden;
        }
        .ticket-body { padding:14px 20px; }
        .ticket-title { text-align:center; font-size:30px; font-weight:bold; margin-bottom:4px; }
        .ticket-subtitle { text-align:center; font-size:12px; letter-spacing:1px; margin-bottom:12px; }
        .divider { border-bottom:1px solid #000; margin:8px 0; }
        .dashed-divider { border-bottom:1px dashed #000; margin:6px 0; }
        .info-line { margin:5px 0; font-size:14px; }
        table { width:100%; border-collapse:collapse; margin:6px 0; table-layout:fixed; }
        table th, table td { padding:4px 2px; overflow:hidden; white-space:nowrap; font-size:13px; }
        table th:nth-child(1), table td:nth-child(1){ width:25%; text-align:left; }
        table th:nth-child(2), table td:nth-child(2){ width:25%; text-align:right; }
        table th:nth-child(3), table td:nth-child(3){ width:25%; text-align:right; }
        table th:nth-child(4), table td:nth-child(4){ width:25%; text-align:right; }
        .note-block { margin:8px 0; font-size:13px; }

        .qr-row { display:flex; justify-content:center; gap:16px; margin:12px 0 8px; }
        .qr-box { display:flex; flex-direction:column; align-items:center; gap:4px; }
        .qr-square { width:76px; height:76px; border:1px solid #999; border-radius:6px; display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; font-size:11px; color:#999; }
        .qr-square img { width:100%; height:100%; object-fit:cover; display:block; }
        .qr-circle { width:76px; height:76px; border:1px solid #999; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; font-size:11px; color:#999; }
        .qr-circle img { width:100%; height:100%; object-fit:cover; display:block; }
        .qr-label { font-size:11px; color:#666; }

        .thanks-box {
            text-align:center;
            font-size:18px;
            padding:5px 16px;
            margin:6px auto 10px auto;
            border-radius:999px;
            width:fit-content;
        }
        .thanks-sub { text-align:center; font-size:11px; margin-top:2px; margin-bottom:6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="form-panel">
        <h3>订单配置</h3>
        <div class="tip-box">
            💡 使用提示：<br>
            1. 在左侧填写订单信息、添加项目、上传收款码<br>
            2. 右侧实时预览小票效果<br>
            3. 点击"导出图片"保存小票为PNG<br>
            4. 微信/QQ内导出后请长按图片保存到相册
        </div>
        <div class="form-item">
            <label>店铺名称</label>
            <input type="text" id="shopName" value="SNOWの衣柜小铺">
        </div>
        <div class="form-item">
            <label>店铺英文副标题</label>
            <input type="text" id="shopSubTitle" value="· EXCLUSIVE CONSUMPTION RECEIPT ·">
        </div>
        <div class="form-item">
            <label>下单人</label>
            <input type="text" id="buyerName" placeholder="填写下单人">
        </div>
        <div class="form-item">
            <label>订单编号</label>
            <input type="text" id="orderId" value="">
        </div>
        <div class="form-item">
            <label>订单时间</label>
            <input type="text" id="orderTime" value="">
        </div>

        <div class="row-block">
            <h4>小票样式</h4>
            <div class="form-item">
                <label>小票背景颜色</label>
                <input type="color" class="color-input" id="bgColor" value="#ffffff" oninput="updateTicketStyle()">
            </div>
            <div class="form-item">
                <label>正文文字颜色</label>
                <input type="color" class="color-input" id="textColor" value="#000000" oninput="updateTicketStyle()">
            </div>
            <div class="form-item">
                <label>标题文字颜色</label>
                <input type="color" class="color-input" id="titleColor" value="#000000" oninput="updateTicketStyle()">
            </div>
            <div class="form-item">
                <label>顶部装饰栏颜色</label>
                <input type="color" class="color-input" id="topDecorColor" value="#f8b8d4" oninput="updateTicketStyle()">
            </div>
            <div class="form-item">
                <label>底部装饰栏颜色</label>
                <input type="color" class="color-input" id="bottomDecorColor" value="#b8c8f8" oninput="updateTicketStyle()">
            </div>
            <div class="form-item">
                <label>小票字体</label>
                <select id="fontSelect" onchange="updateTicketStyle()">
                    <option value="serif">宋体</option>
                    <option value="SimHei">黑体</option>
                    <option value="Microsoft YaHei">微软雅黑</option>
                    <option value="KaiTi">楷体</option>
                </select>
            </div>
            <div class="form-item">
                <label>小票宽度(px)</label>
                <input type="number" id="ticketWidth" value="340" oninput="updateTicketStyle()">
            </div>
        </div>

        <div class="row-block">
            <h4>收款码上传与显示开关</h4>
            <div class="switch-row">
                <label><input type="checkbox" id="showAlipay" onchange="calcAll()"> 支付宝</label>
                <label><input type="checkbox" id="showReward" onchange="calcAll()"> 赞赏码(圆)</label>
                <label><input type="checkbox" id="showWechat" onchange="calcAll()"> 微信</label>
            </div>
            <div class="form-item">
                <label>支付宝二维码（正方形）</label>
                <input type="file" id="alipayImg" accept="image/*" onchange="loadQR('alipayImg','t_alipay')">
            </div>
            <div class="form-item">
                <label>微信赞赏码（圆形）</label>
                <input type="file" id="rewardImg" accept="image/*" onchange="loadQR('rewardImg','t_reward')">
            </div>
            <div class="form-item">
                <label>微信二维码（正方形）</label>
                <input type="file" id="wechatImg" accept="image/*" onchange="loadQR('wechatImg','t_wechat')">
            </div>
        </div>

        <div class="row-block">
            <h4>主项目列表</h4>
            <div id="goodsBox"></div>
            <button class="btn-add" onclick="addGoods()">+ 添加项目</button>
        </div>

        <div class="row-block">
            <h4>附加项目</h4>
            <div id="extraBox"></div>
            <button class="btn-add" onclick="addExtra()">+ 添加附加项目</button>
        </div>

        <div class="row-block">
            <h4>备注</h4>
            <textarea id="remark" placeholder="填写订单备注"></textarea>
        </div>

        <div class="row-block">
            <h4>金额设置</h4>
            <div class="form-item">
                <label>优惠金额（无优惠填0）</label>
                <input type="number" id="discountMoney" value="0">
            </div>
        </div>

        <div class="row-block">
            <h4>底部文字</h4>
            <div class="form-item">
                <label>底部大文字</label>
                <input type="text" id="footerMain" value="谢谢惠顾">
            </div>
            <div class="form-item">
                <label>底部小英文</label>
                <input type="text" id="footerSub" value="HAVE A NICE DAY">
            </div>
        </div>

        <button class="btn-calc" onclick="calcAll()">计算全部价格</button>
        <button class="btn-copy" style="margin-left:8px" onclick="copyTicketText()">复制文本</button>
        <button class="btn-save" style="margin-left:8px" onclick="saveTicketImg()">导出图片</button>
        <button class="btn-reset" style="margin-left:8px;margin-top:8px" onclick="resetAll()">清空全部</button>
    </div>

    <div class="ticket-panel">
        <h3>小票预览</h3>
        <div id="ticketDom" class="ticket">
            <div class="decor-bar" id="topDecor"></div>
            <div class="ticket-body">
                <div class="ticket-title">SNOWの衣柜小铺</div>
                <div class="ticket-subtitle">· EXCLUSIVE CONSUMPTION RECEIPT ·</div>
                <div class="divider"></div>
                <div class="info-line">下单人：<span id="t_buyerName"></span></div>
                <div class="info-line">订单编号：<span id="t_orderId"></span></div>
                <div class="info-line">订单时间：<span id="t_orderTime"></span></div>
                <div class="divider"></div>

                <table>
                    <colgroup><col><col><col><col></colgroup>
                    <thead><tr><th>项目</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
                    <tbody id="t_goods"></tbody>
                </table>
                <div class="dashed-divider"></div>

                <table>
                    <colgroup><col><col><col><col></colgroup>
                    <thead><tr><th>附加项目</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
                    <tbody id="t_extra"></tbody>
                </table>
                <div class="divider"></div>

                <div class="note-block">备注:<span id="t_remark"></span></div>
                <div class="info-line">应收金额:<span id="t_receiveTotal"></span></div>
                <div class="info-line">优惠:<span id="t_discountMoney"></span></div>
                <div class="info-line"><strong>实付金额:<span id="t_realPay"></span></strong></div>

                <div class="qr-row">
                    <div class="qr-box" id="box_alipay">
                        <div class="qr-square" id="t_alipay"><span>支付宝</span></div>
                        <div class="qr-label">支付宝</div>
                    </div>
                    <div class="qr-box" id="box_reward">
                        <div class="qr-circle" id="t_reward"><span>赞赏码</span></div>
                        <div class="qr-label">赞赏码</div>
                    </div>
                    <div class="qr-box" id="box_wechat">
                        <div class="qr-square" id="t_wechat"><span>微信</span></div>
                        <div class="qr-label">微信</div>
                    </div>
                </div>

                <div class="thanks-box" id="thanksBox">谢谢惠顾</div>
                <div class="thanks-sub" id="thanksSub">HAVE A NICE DAY</div>
            </div>
            <div class="decor-bar" id="bottomDecor"></div>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = "receipt_save_data";

let qrData = { alipay: "", reward: "", wechat: "" };
let qrShow = { alipay: false, reward: false, wechat: false };

let goodsList = [
    {name:"素材",price:0.2,num:35},
    {name:"加框",price:0.1,num:20},
    {name:"加字",price:0.1,num:20},
    {name:"异形卡面",price:1,num:5},
    {name:"存档",price:3,num:1},
    {name:"模板费",price:3,num:1}
];
let extraList = [
    {name:"加急",price:10,num:1},
    {name:"双页",price:5,num:1},
    {name:"大改",price:10,num:1}
];

function loadLocalData(){
    const str = localStorage.getItem(STORAGE_KEY);
    if(!str) return;
    try{
        const data = JSON.parse(str);
        document.getElementById("shopName").value = data.shopName;
        document.getElementById("shopSubTitle").value = data.shopSubTitle;
        document.getElementById("buyerName").value = data.buyerName;
        document.getElementById("orderId").value = data.orderId;
        document.getElementById("orderTime").value = data.orderTime;
        document.getElementById("bgColor").value = data.bgColor;
        document.getElementById("textColor").value = data.textColor;
        document.getElementById("titleColor").value = data.titleColor;
        document.getElementById("topDecorColor").value = data.topDecorColor || "#f8b8d4";
        document.getElementById("bottomDecorColor").value = data.bottomDecorColor || "#b8c8f8";
        document.getElementById("fontSelect").value = data.fontSelect;
        document.getElementById("ticketWidth").value = data.ticketWidth;
        document.getElementById("remark").value = data.remark;
        document.getElementById("discountMoney").value = data.discountMoney;
        document.getElementById("footerMain").value = data.footerMain;
        document.getElementById("footerSub").value = data.footerSub;
        goodsList = data.goodsList;
        extraList = data.extraList;
        qrData.alipay = data.qrData?.alipay || "";
        qrData.reward = data.qrData?.reward || "";
        qrData.wechat = data.qrData?.wechat || "";
        qrShow.alipay = data.qrShow?.alipay || false;
        qrShow.reward = data.qrShow?.reward || false;
        qrShow.wechat = data.qrShow?.wechat || false;
        document.getElementById("showAlipay").checked = qrShow.alipay;
        document.getElementById("showReward").checked = qrShow.reward;
        document.getElementById("showWechat").checked = qrShow.wechat;
    }catch(e){}
}

function saveLocalData(){
    qrShow.alipay = document.getElementById("showAlipay").checked;
    qrShow.reward = document.getElementById("showReward").checked;
    qrShow.wechat = document.getElementById("showWechat").checked;
    const data = {
        shopName:document.getElementById("shopName").value,
        shopSubTitle:document.getElementById("shopSubTitle").value,
        buyerName:document.getElementById("buyerName").value,
        orderId:document.getElementById("orderId").value,
        orderTime:document.getElementById("orderTime").value,
        bgColor:document.getElementById("bgColor").value,
        textColor:document.getElementById("textColor").value,
        titleColor:document.getElementById("titleColor").value,
        topDecorColor:document.getElementById("topDecorColor").value,
        bottomDecorColor:document.getElementById("bottomDecorColor").value,
        fontSelect:document.getElementById("fontSelect").value,
        ticketWidth:document.getElementById("ticketWidth").value,
        remark:document.getElementById("remark").value,
        discountMoney:document.getElementById("discountMoney").value,
        footerMain:document.getElementById("footerMain").value,
        footerSub:document.getElementById("footerSub").value,
        goodsList:goodsList,
        extraList:extraList,
        qrData: qrData,
        qrShow: qrShow
    };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function hexToRgb(hex){
    hex = hex.replace("#","");
    if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
    return {
        r: parseInt(hex.slice(0,2),16),
        g: parseInt(hex.slice(2,4),16),
        b: parseInt(hex.slice(4,6),16)
    };
}
function rgbStr(r,g,b){ return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`; }
function lighten(hex, amt){
    const {r,g,b} = hexToRgb(hex);
    // 只向白色提亮，不往深色走，避免脏色
    const nr = Math.min(255, r + (255 - r) * amt / 100);
    const ng = Math.min(255, g + (255 - g) * amt / 100);
    const nb = Math.min(255, b + (255 - b) * amt / 100);
    return rgbStr(nr, ng, nb);
}

function updateTicketStyle(){
    const bg = document.getElementById("bgColor").value;
    const text = document.getElementById("textColor").value;
    const title = document.getElementById("titleColor").value;
    const font = document.getElementById("fontSelect").value;
    const width = document.getElementById("ticketWidth").value;
    const topC = document.getElementById("topDecorColor").value;
    const botC = document.getElementById("bottomDecorColor").value;

    const ticketDom = document.getElementById("ticketDom");
    ticketDom.style.backgroundColor = bg;
    ticketDom.style.color = text;
    ticketDom.style.fontFamily = font;
    ticketDom.style.width = width + "px";

    // 顶栏上深下浅，底栏上浅下深（同色系，不出现黑灰）
    const topDecor = document.getElementById("topDecor");
    const botDecor = document.getElementById("bottomDecor");
    topDecor.style.background = `linear-gradient(180deg, ${topC}, ${lighten(topC, 35)}, ${lighten(topC, 60)})`;
    botDecor.style.background = `linear-gradient(180deg, ${lighten(botC, 60)}, ${lighten(botC, 35)}, ${botC})`;

    ticketDom.querySelector(".ticket-title").style.color = title;
    ticketDom.querySelector(".ticket-subtitle").style.color = title;
    ticketDom.querySelectorAll(".divider").forEach(el=>{ el.style.borderColor = text; });
    ticketDom.querySelector(".dashed-divider").style.borderColor = text;

    const thanksBox = document.getElementById("thanksBox");
    thanksBox.style.background = `linear-gradient(90deg, ${lighten(topC, 80)}, ${lighten(botC, 80)})`;
    thanksBox.style.color = title;

    saveLocalData();
}

function renderGoodsForm(){
    const box = document.getElementById("goodsBox");
    box.innerHTML = "";
    goodsList.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className="list-row";
        div.innerHTML = `
            <input placeholder="项目名称" value="${item.name}" oninput="goodsList[${idx}].name=this.value;saveLocalData()">
            <input type="number" placeholder="单价" value="${item.price}" oninput="goodsList[${idx}].price=Number(this.value);saveLocalData()">
            <input type="number" placeholder="数量" value="${item.num}" oninput="goodsList[${idx}].num=Number(this.value);saveLocalData()">
            <button onclick="delGoods(${idx})">删</button>
        `;
        box.appendChild(div);
    });
}
function renderExtraForm(){
    const box = document.getElementById("extraBox");
    box.innerHTML = "";
    extraList.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className="list-row";
        div.innerHTML = `
            <input placeholder="附加项目" value="${item.name}" oninput="extraList[${idx}].name=this.value;saveLocalData()">
            <input type="number" placeholder="单价" value="${item.price}" oninput="extraList[${idx}].price=Number(this.value);saveLocalData()">
            <input type="number" placeholder="数量" value="${item.num}" oninput="extraList[${idx}].num=Number(this.value);saveLocalData()">
            <button onclick="delExtra(${idx})">删</button>
        `;
        box.appendChild(div);
    });
}

function addGoods(){ goodsList.push({name:"",price:0,num:0}); renderGoodsForm(); saveLocalData(); }
function delGoods(i){ goodsList.splice(i,1); renderGoodsForm(); saveLocalData(); }
function addExtra(){ extraList.push({name:"",price:0,num:0}); renderExtraForm(); saveLocalData(); }
function delExtra(i){ extraList.splice(i,1); renderExtraForm(); saveLocalData(); }

function loadQR(inputId, targetId) {
    const file = document.getElementById(inputId).files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
        const base64 = e.target.result;
        if (inputId === "alipayImg") { qrData.alipay = base64; renderQR("t_alipay", base64, "square"); }
        else if (inputId === "rewardImg") { qrData.reward = base64; renderQR("t_reward", base64, "circle"); }
        else if (inputId === "wechatImg") { qrData.wechat = base64; renderQR("t_wechat", base64, "square"); }
        saveLocalData();
        calcAll();
    };
    reader.readAsDataURL(file);
}
function renderQR(targetId, base64, type) {
    const box = document.getElementById(targetId);
    if (!base64) { box.innerHTML = type === "circle" ? "<span>赞赏码</span>" : "<span>二维码</span>"; return; }
    box.innerHTML = `<img src="${base64}">`;
}

function calcAll(){
    const shopName = document.getElementById("shopName").value;
    const shopSubTitle = document.getElementById("shopSubTitle").value;
    const buyerName = document.getElementById("buyerName").value;
    const orderId = document.getElementById("orderId").value;
    const orderTime = document.getElementById("orderTime").value;
    const remark = document.getElementById("remark").value;
    const discountMoney = Number(document.getElementById("discountMoney").value)||0;
    const footerMain = document.getElementById("footerMain").value;
    const footerSub = document.getElementById("footerSub").value;

    let goodsSum = 0;
    goodsList.forEach(g=>{ g.sub = Number(g.price)*Number(g.num); goodsSum += g.sub; });
    let extraSum =0;
    extraList.forEach(e=>{ e.sub = Number(e.price)*Number(e.num); extraSum += e.sub; });
    const receiveTotal = goodsSum + extraSum;
    const realPay = receiveTotal - discountMoney;

    document.querySelector(".ticket-title").innerText = shopName;
    document.querySelector(".ticket-subtitle").innerText = shopSubTitle;
    document.getElementById("t_buyerName").innerText = buyerName;
    document.getElementById("t_orderId").innerText = orderId;
    document.getElementById("t_orderTime").innerText = orderTime;
    document.getElementById("t_remark").innerText = remark;
    document.getElementById("thanksBox").innerText = footerMain;
    document.getElementById("thanksSub").innerText = footerSub;

    const tGoods = document.getElementById("t_goods");
    tGoods.innerHTML = "";
    goodsList.forEach(g=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${g.name}</td><td>${g.price}</td><td>${g.num}</td><td>${g.sub.toFixed(2)}</td>`;
        tGoods.appendChild(tr);
    });
    const tExtra = document.getElementById("t_extra");
    tExtra.innerHTML = "";
    extraList.forEach(e=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${e.name}</td><td>${e.price}</td><td>${e.num}</td><td>${e.sub.toFixed(2)}</td>`;
        tExtra.appendChild(tr);
    });

    document.getElementById("t_receiveTotal").innerText = receiveTotal.toFixed(2);
    document.getElementById("t_discountMoney").innerText = discountMoney.toFixed(2);
    document.getElementById("t_realPay").innerText = realPay.toFixed(2);

    document.getElementById("box_alipay").style.display = document.getElementById("showAlipay").checked ? "flex" : "none";
    document.getElementById("box_reward").style.display = document.getElementById("showReward").checked ? "flex" : "none";
    document.getElementById("box_wechat").style.display = document.getElementById("showWechat").checked ? "flex" : "none";

    saveLocalData();
}

function copyTicketText(){
    const text = document.getElementById("ticketDom").innerText;
    navigator.clipboard.writeText(text).then(()=>{ alert("小票文本已经复制到剪贴板！"); });
}

function saveTicketImg(){
    html2canvas(document.getElementById("ticketDom"),{ useCORS:true, scale:2 }).then(canvas=>{
        const link = document.createElement('a');
        link.download = "订单小票.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

function resetAll(){
    localStorage.removeItem(STORAGE_KEY);
    goodsList = []; extraList = [];
    qrData = { alipay: "", reward: "", wechat: "" };
    qrShow = { alipay: false, reward: false, wechat: false };
    document.getElementById("shopName").value="";
    document.getElementById("shopSubTitle").value="";
    document.getElementById("buyerName").value="";
    document.getElementById("orderId").value="";
    document.getElementById("orderTime").value="";
    document.getElementById("remark").value="";
    document.getElementById("discountMoney").value=0;
    document.getElementById("footerMain").value="谢谢惠顾";
    document.getElementById("footerSub").value="HAVE A NICE DAY";
    document.getElementById("showAlipay").checked = false;
    document.getElementById("showReward").checked = false;
    document.getElementById("showWechat").checked = false;
    renderQR("t_alipay", "", "square");
    renderQR("t_reward", "", "circle");
    renderQR("t_wechat", "", "square");
    renderGoodsForm();
    renderExtraForm();
    updateTicketStyle();
    calcAll();
}

window.onload = function(){
    loadLocalData();
    renderGoodsForm();
    renderExtraForm();
    if (qrData.alipay) renderQR("t_alipay", qrData.alipay, "square");
    if (qrData.reward) renderQR("t_reward", qrData.reward, "circle");
    if (qrData.wechat) renderQR("t_wechat", qrData.wechat, "square");
    updateTicketStyle();
    calcAll();
}
</script>
</body>
</html>
